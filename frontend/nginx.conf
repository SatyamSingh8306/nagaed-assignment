limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=6r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"message":"Too many suggestions; try again shortly"}}';
    }
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location = /health { access_log off; return 200 'ok'; }
    location = /api/suggest-username {
        limit_req zone=ai_limit burst=3 nodelay;
        proxy_pass http://ai:8000;
        proxy_read_timeout 25s;
    }
    location /api/ { proxy_pass http://api:3000; }
    location = /docs {
        proxy_pass http://ai:8000;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
    }
    location = /openapi.json { proxy_pass http://ai:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
